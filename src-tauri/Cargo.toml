[package]
name = "folder-explorer"
version = "0.3.0"
description = "Telefon tarzı klasörlerle masaüstü"
authors = ["Folder Explorer"]
license = "MIT"
repository = "https://github.com/Cafunw/folder-explorer"
edition = "2021"

[lib]
name = "folder_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
png = "0.17"
# same version as tauri's own (WebView2 suspend / memory target of hidden webviews)
webview2-com = "0.39"
# the async types of the windows crate (Windows Hello for locked groups)
windows-future = "0.3"
# `#[implement]` (the progress sink of moves) names this crate directly
windows-core = "0.62"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_System_WinRT",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Search",
  "Win32_System_Search_Common",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[lints.clippy]
# archive.rs: GetProcAddress results take their fn type from the Lib field they fill
missing_transmute_annotations = "allow"
# SetPropW flags store the handle value 1; it is a marker, not a dangling pointer
manual_dangling_ptr = "allow"
