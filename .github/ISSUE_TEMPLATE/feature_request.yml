name: Feature request
description: An idea that would make Folder Explorer better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem first, then the idea. "I keep many game shortcuts and…" helps more than a feature name alone.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. Other apps that do it well are welcome too.
