name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # the Rust side calls Win32 through the windows crate
    runs-on: windows-latest
    # minutes are billed (Windows counts double): stop a hung run early
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # also writes dist/, which the Tauri build script embeds into the Rust crate
      - run: npm run build

      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # pull requests reuse main's cache instead of storing their own
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo test --lib
        working-directory: src-tauri
      - run: cargo clippy --lib --tests -- -D warnings
        working-directory: src-tauri
