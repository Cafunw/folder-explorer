name: Release

# `npm version X.Y.Z -m "Release %s"` makes the release commit and the tag vX.Y.Z;
# `git push --follow-tags` starts this: the installer is built from the tag, signed for the
# updater, and published with the version's CHANGELOG entries, its checksum and latest.json (the
# file the app's update check reads). Needs the repository secret TAURI_SIGNING_PRIVATE_KEY.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe in the build needs the tags (Settings > About)
          fetch-depth: 0

      - name: The tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm test

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      # createUpdaterArtifacts writes the installer's .sig; only here, so local builds need no key
      - name: Build and sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Installer, checksum, notes and latest.json
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="Folder.Explorer_${version}_x64-setup.exe"
          built="src-tauri/target/release/bundle/nsis/Folder Explorer_${version}_x64-setup.exe"
          cp "$built" "$installer"
          sha=$(sha256sum "$installer" | cut -d' ' -f1)
          node scripts/changelog.mjs notes "$version" "$sha" > release-notes.md
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${installer}"
          node scripts/changelog.mjs update "$version" "$url" "$built.sig" > latest.json
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$INSTALLER" latest.json --title "Folder Explorer $VERSION" --notes-file release-notes.md --verify-tag
