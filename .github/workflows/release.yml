name: Release

# `npm version X.Y.Z -m "Release %s"` makes the release commit and the tag vX.Y.Z;
# `git push --follow-tags` starts this: the installer is built from the tag and published with
# the version's CHANGELOG entries and its checksum.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe in the build needs the tags (Settings > About)
          fetch-depth: 0

      - name: The tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm test

      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - run: npx tauri build

      - name: Installer, checksum and notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="Folder.Explorer_${version}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/nsis/Folder Explorer_${version}_x64-setup.exe" "$installer"
          sha=$(sha256sum "$installer" | cut -d' ' -f1)
          node scripts/changelog.mjs notes "$version" "$sha" > release-notes.md
          echo "INSTALLER=$installer" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$INSTALLER" --title "Folder Explorer $VERSION" --notes-file release-notes.md --verify-tag
